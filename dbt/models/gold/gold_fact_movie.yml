models:
  - name: gold_fact_movie
    description: Fact table for movie-level metrics and business keys.
    columns:
      - name: movie_key
        description: Surrogate key for the movie.
        tests:
          - not_null
          - unique

      - name: date_key
        description: Release year of the movie.

      - name: runtime
        description: Runtime in minutes.
        tests:
          - not_null

      - name: vote_average
        description: Average rating from users.
        tests:
          - not_null

      - name: vote_count
        description: Number of votes received.
        tests:
          - not_null

      - name: popularity
        description: Popularity score of the movie.
        tests:
          - not_null

      - name: revenue
        description: Total revenue generated by the movie.
        tests:
          - not_null

      - name: budget
        description: Production budget of the movie.
        tests:
          - not_null

