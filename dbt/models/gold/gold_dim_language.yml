models:
  - name: gold_dim_language
    description: "Language dimension containing unique spoken language attributes"

    columns: 
      - name: language_key
        description: "Primary key for the language dimension table"
        data_tests:
          - not_null
          - unique
      
      - name: spoken_language_english_name
        description: "English name of the spoken language"
        data_tests: 
          - not_null

      - name: spoken_language_code
        description: "ISO 639-1 language code"
        data_tests: 
          - not_null
          - unique
