models:
  - name: gold_dim_genre
    description: "Genre dimension containing unique movie genre attributes"

    columns:
      - name: genre_key
        description: "Primary key for the genre dimension table"
        data_tests:
          - not_null
          - unique

      - name: tmdb_genre_id
        description: "Unique genre identifier from The Movie Database (TMDb)"
        data_tests:
          - not_null
          - unique

      - name: genre_name
        description: "Name of the genre"
        data_tests:
          - not_null
